<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Nature</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;color:#fff;min-height:100vh}

/* Fond plein écran, fixe pendant le scroll pour rester immersif même quand des résultats apparaissent */
.bg{
  position:fixed;inset:0;z-index:-2;
  background-image:url('fond_final/mare-lotus.webp');
  background-size:cover;background-position:center 38%;background-repeat:no-repeat;
}
@media (max-width:700px){ .bg{background-image:url('fond_final/mare-lotus-mobile.webp')} }
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 55% at 46% 40%, rgba(3,10,6,.5) 0%, rgba(3,10,6,.28) 55%, transparent 80%);
}
/* Voile qui s'assombrit progressivement une fois qu'on scrolle vers les résultats, pour la lisibilité */
.dim{position:fixed;inset:0;z-index:-1;background:rgba(2,6,3,0);transition:background .3s;pointer-events:none}
.dim.on{background:rgba(2,6,3,.35)}

.stage{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px 40px}

.logo-wrap{margin-bottom:10px;text-align:center;position:relative}
.logo-wrap::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
  width:96%;height:82%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.48) 0%, rgba(0,0,0,.22) 46%, transparent 72%);
}
.logo-wrap img{
  position:relative;z-index:1;width:440px;max-width:86vw;height:auto;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.55)) drop-shadow(0 10px 20px rgba(0,0,0,.38));
}
.tagline{opacity:.95;font-size:.95rem;margin-bottom:34px;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.85)}

.searchwrap{width:100%;max-width:600px}
.searchbar{width:100%;background:rgba(4,12,7,.55);border:1px solid rgba(255,255,255,.28);border-radius:40px;padding:16px 26px;font-size:1rem;color:#fff;backdrop-filter:blur(12px) saturate(1.1);display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:.2s}
.searchbar:focus-within{border-color:rgba(255,255,255,.5);box-shadow:0 14px 50px rgba(0,0,0,.6)}
.searchbar input{background:none;border:none;color:#fff;font-size:1rem;flex:1;outline:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.searchbar input::placeholder{color:rgba(255,255,255,.6)}

.chips-wrap{max-width:820px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:18px;max-width:820px}
.chip{background:rgba(4,12,7,.45);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:5px 11px;font-size:.68rem;cursor:pointer;backdrop-filter:blur(6px);text-shadow:0 1px 4px rgba(0,0,0,.6);transition:.15s}
.chip:hover,.chip.active{background:rgba(76,175,80,.35);border-color:rgba(76,175,80,.6)}

@media (max-width:700px){
  .chips-wrap{max-width:100%;padding:0}
  .chips{
    flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;
    max-width:100%;padding:2px 20px 10px;margin-left:-20px;margin-right:-20px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0}
}

.hint{opacity:.55;font-size:.8rem;margin-top:22px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.7)}

/* Zone de résultats — vide au départ, se peuple dynamiquement */
.results{width:100%;max-width:640px;margin-top:10px;display:flex;flex-direction:column;gap:14px;padding-bottom:60px}
.rcount{opacity:.75;font-size:.82rem;text-align:center;margin-bottom:4px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.rcard{background:rgba(4,10,6,.68);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:18px 22px;backdrop-filter:blur(12px) saturate(1.1);cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:.2s;animation:riseIn .35s ease both}
.rcard:hover{border-color:rgba(255,255,255,.4);transform:translateY(-2px)}
.rcard .cat{display:inline-block;color:#fff;border-radius:20px;padding:2px 11px;font-size:.68rem;font-weight:700;margin-bottom:7px}
.rcard h3{font-size:1.02rem;margin-bottom:3px}
.rcard .meta{opacity:.75;font-size:.78rem;margin-bottom:9px}
.rcard p{font-size:.85rem;opacity:.92;line-height:1.5}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.empty-note{opacity:.5;font-size:.85rem;text-align:center;margin-top:30px;text-shadow:0 1px 6px rgba(0,0,0,.7)}

/* Fiche immersive plein écran (identique à la V1, réutilisée à l'identique) */
.fiche-page{position:fixed;inset:0;background:radial-gradient(ellipse at top,#0d1f14 0%,#050b06 60%);z-index:200;overflow-y:auto;
  transform:translateY(24px);opacity:0;visibility:hidden;transition:transform .38s cubic-bezier(.22,.9,.32,1),opacity .32s ease,visibility 0s}
.fiche-page.open{transform:translateY(0);opacity:1;visibility:visible}
.fiche-topbar{position:sticky;top:0;z-index:20;background:rgba(4,10,6,.75);backdrop-filter:blur(12px);padding:14px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,.1)}
.fiche-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 16px;border-radius:30px;font-size:.85rem;cursor:pointer}
.fiche-topbar .catbadge{background:rgba(76,175,80,.25);color:#c8e6c9;padding:4px 14px;border-radius:20px;font-size:.78rem}
.infograph-full{width:100%;max-height:78vh;overflow:hidden;position:relative;background:#020604;cursor:pointer}
.infograph-full img{width:100%;height:auto;display:block}
.infograph-full::after{content:"";position:absolute;bottom:0;left:0;right:0;height:110px;background:linear-gradient(to bottom,transparent,#050b06)}

.imgviewer{position:fixed;inset:0;background:#000;z-index:500;display:none;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.imgviewer.open{display:flex;align-items:center}
.imgviewer img{height:100vh;width:auto;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.imgviewer-close{position:fixed;top:16px;right:16px;z-index:10;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.1rem;backdrop-filter:blur(8px)}
.imgviewer-hint{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:.78rem;opacity:.7;z-index:10;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none;animation:fadeOutHint 3s forwards}
@keyframes fadeOutHint{0%,60%{opacity:.7}100%{opacity:0}}
.fiche-body{max-width:760px;margin:-20px auto 60px;padding:0 20px;position:relative;z-index:5}
.fiche-head{text-align:center;margin-bottom:30px;padding-top:20px}
.fiche-head h1{font-size:1.8rem;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.7);margin-bottom:6px}
.fiche-head .meta{opacity:.8;font-size:.9rem;color:#fff}
.grid-prem{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.grid-prem .box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:18px 20px;backdrop-filter:blur(10px);font-size:.9rem;color:#fff}
.grid-prem .box.full{grid-column:1/-1}
.grid-prem .box.histo{background:rgba(255,213,79,.08);border-color:rgba(255,213,79,.25);font-style:italic}
.grid-prem .box b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:#a5d6a7;margin-bottom:8px;font-weight:700;font-style:normal}
.grid-prem .box.histo b{color:#ffd54f}
.grid-prem .box.alert{background:rgba(229,57,53,.1);border-color:rgba(229,57,53,.3)}
.grid-prem .box.alert b{color:#ef9a9a}
.chk{list-style:none;padding:0;margin-top:4px}
.chk li{margin:6px 0;padding-left:26px;position:relative;font-size:.9rem}
.chk.ok li::before{content:"✅";position:absolute;left:0}
.chk.no li::before{content:"🚫";position:absolute;left:0}
.disclaimer{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.25);border-radius:12px;padding:14px 16px;margin-top:16px;font-size:.78rem;opacity:.85;line-height:1.5;text-align:center}
.disclaimer b{opacity:1}
.urgence-banner{background:rgba(211,47,47,.22);border:1.5px solid rgba(239,154,154,.6);border-radius:14px;padding:16px 18px;margin:14px 0 20px;text-align:center}
.urgence-banner .titre{font-weight:800;color:#ffcdd2;font-size:.95rem;margin-bottom:6px}
.urgence-banner .nums{font-size:.85rem;opacity:.9}
@media(max-width:600px){.grid-prem{grid-template-columns:1fr}}

.switch-version{position:fixed;top:16px;right:16px;z-index:60;background:rgba(4,10,6,.6);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:20px;font-size:.75rem;text-decoration:none;backdrop-filter:blur(8px)}
</style>
<!-- Analytics respectueux de la vie privée (RGPD-friendly, sans bannière cookie nécessaire) -->
<script defer data-domain="TON-DOMAINE.vercel.app" src="https://plausible.io/js/script.js"></script>
</head>
<body>

<div class="bg"></div>
<div class="dim" id="dim"></div>

<div class="stage">
  <div class="logo-wrap">
    <img src="logos/atlas-nature.webp?v=2" alt="Atlas Nature">

      <button id="micBtn" onclick="startDictation()" style="display:none;background:none;border:none;font-size:1.15rem;cursor:pointer;color:#fff" title="Recherche vocale">🎤</button>

    <a href="cgv.html" style="color:inherit">CGV</a>

<!-- Fiche immersive plein écran -->
<!-- Viewer plein écran pour l'infographie (mobile) -->
<div class="imgviewer" id="imgViewer">
  <button class="imgviewer-close" onclick="closeImgViewer()">✕</button>
  <img id="imgViewerImg" src="" alt="Infographie plein écran">

</div>

<div class="fiche-page" id="fichePage">
  <div class="fiche-topbar">
    <button class="fiche-back" onclick="closeFiche()">← Retour</button>
    <span class="catbadge" id="ficheCat"></span>
  </div>

</div>

<!-- Formulaire d'édition (protégé par mot de passe) -->
<div class="modal" id="formModal" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300;padding:20px">
  <div style="background:#0d1f14;border:1px solid rgba(255,255,255,.15);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:24px">
    <button onclick="closeForm()" style="float:right;background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    <h2 id="formTitle" style="margin-bottom:14px">✏️ Modifier le remède</h2>
    <form id="rform" onsubmit="return false;" style="display:flex;flex-direction:column;gap:6px">
      <label style="font-size:.75rem;opacity:.7">Catégorie</label><input name="categorie" style="padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff">
      <label style="font-size:.75rem;opacity:.7">Maladie</label><input name="maladie" style="padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff">
      <label style="font-size:.75rem;opacity:.7">Symptômes</label><input name="symptomes" style="padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff">
      <label style="font-size:.75rem;opacity:.7">Complément</label><input name="complement" style="padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff">
      <label style="font-size:.75rem;opacity:.7">Posologie</label><input name="recours" style="padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff">
      <label style="font-size:.75rem;opacity:.7">Contre-indication</label><input name="contre" style="padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff">
      <label style="font-size:.75rem;opacity:.7">Drapeaux rouges</label><input name="drapeaux" style="padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff">
      <div style="display:flex;gap:10px;margin-top:14px">
        <button onclick="saveForm()" style="flex:1;padding:11px;border-radius:8px;border:none;background:#4caf50;color:#fff;font-weight:700;cursor:pointer">💾 Enregistrer</button>
        <button onclick="closeForm()" style="flex:1;padding:11px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer">Annuler</button>
      </div>
    </form>
  </div>
</div>
<div id="statusMsg" style="position:fixed;top:16px;right:16px;background:#263238;color:#fff;padding:9px 18px;border-radius:8px;font-size:.85rem;z-index:400;opacity:0;transition:.3s"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ngvkgdojbwasnoasaqen.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ndmtnZG9qYndhc25vYXNhcWVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDI2MzYsImV4cCI6MjEwMTc3ODYzNn0.y-Z9X3hyhAolT_588JBdL5fEuOyO0ALHB-V97h6HK00';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CC = {"Appareil urinaire": "#e91e63", "Appétit & Sucres": "#43a047", "Circulation & Cœur": "#8e24aa", "Digestion & Transit": "#fb8c00", "Douleurs & Neurologie": "#fbc02d", "Détox & Élimination": "#d81b60", "Fatigue & Énergie": "#00838f", "Fertilité & Conception": "#0277bd", "Homme & Vitalité": "#5d4037", "Hormones & Ménopause": "#6a1b9a", "Immunité & Défenses": "#ef6c00", "Migraines & Céphalées": "#2e7d32", "Mémoire, Concentration & Cerveau": "#c62828", "Métabolisme & Poids": "#455a64", "Os & Articulations": "#558b2f", "Peau, Cheveux & Ongles": "#d84315", "Prévention & Anti-âge": "#3949ab", "Récupération sportive & Muscles": "#00695c", "Santé Mentale & Émotions": "#26a69a", "Santé bucco-dentaire": "#e64a19", "Sphère ORL (Oreille-Nez-Gorge)": "#e91e63", "Stress, Anxiété & Sommeil": "#43a047", "Traumatologie & Blessures": "#8e24aa", "Urgences & Premiers secours": "#fb8c00", "Voies respiratoires": "#fbc02d", "Yeux & Vision": "#d81b60"};
const CE = {"Hormones & Ménopause": "🌸", "Digestion & Transit": "🌿", "Stress, Anxiété & Sommeil": "😴", "Immunité & Défenses": "🛡️", "Fatigue & Énergie": "⚡", "Circulation & Cœur": "❤️", "Peau, Cheveux & Ongles": "✨", "Os & Articulations": "🦴", "Voies respiratoires": "🫁", "Métabolisme & Poids": "⚖️", "Appareil urinaire": "🚽", "Yeux & Vision": "👀", "Mémoire, Concentration & Cerveau": "🧠", "Santé bucco-dentaire": "🦷", "Récupération sportive & Muscles": "💪", "Migraines & Céphalées": "🤕", "Détox & Élimination": "🧪", "Fertilité & Conception": "🤰", "Sphère ORL (Oreille-Nez-Gorge)": "👂", "Appétit & Sucres": "🍬", "Urgences & Premiers secours": "🚑", "Traumatologie & Blessures": "🩹", "Douleurs & Neurologie": "💊", "Santé Mentale & Émotions": "💆", "Prévention & Anti-âge": "🌱", "Homme & Vitalité": "♂️"};

let db = [];
let activeCat = null;
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function norm(s){
  let t = (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  // Corrections pour pluriels irréguliers / variantes fréquentes en santé
  t = t.replace(/\bmaux\b/g, 'mal');
  t = t.replace(/\byeux\b/g, 'oeil');
  t = t.replace(/\bœil\b/g, 'oeil');
  t = t.replace(/\bnez\b/g, 'nez');
  return t;
}

async function loadDB(){
  const { data, error } = await sb.from('remedes').select('*').order('categorie').order('maladie');
  if (error){ console.error(error); return; }
  db = data;
  renderChips();
}

function cats(){ return Array.from(new Set(db.map(r=>r.categorie))).sort(); }

function renderChips(){
  const el = document.getElementById('catChips');
  el.innerHTML = cats().map(c =>
    `<span class="chip" onclick='selectCat(${JSON.stringify(c)})'>${CE[c]||'🌿'} ${esc(c)}</span>`
  ).join('');
}

function selectCat(c){
  activeCat = (activeCat===c) ? null : c;
  document.getElementById('searchInput').value = '';
  render();
  document.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('active', ch.textContent.trim().includes(c)));
}

function render(){
  const q = norm(document.getElementById('searchInput').value);
  const dim = document.getElementById('dim');
  const results = document.getElementById('results');
  const hint = document.getElementById('hint');

  if (!q && !activeCat){
    results.innerHTML = '';
    hint.style.display = 'block';
    dim.classList.remove('on');
    return;
  }
  hint.style.display = 'none';
  dim.classList.add('on');

  let list = db.filter(r=>{
    if (activeCat && r.categorie !== activeCat) return false;
    if (q){
      const hay = norm([r.maladie,r.symptomes,r.symptomes_cles,r.complement,r.zone].join(' '));
      const words = q.split(/\s+/).filter(Boolean);
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  }).slice(0,30);

  if (!list.length){
    results.innerHTML = `<p class="empty-note">Aucun résultat pour cette recherche. Essayez un autre mot-clé.</p>`;
    return;
  }

  results.innerHTML = `<p class="rcount">${list.length} solution(s) trouvée(s)</p>` + list.map((r,i)=>{
    const catColor = CC[r.categorie]||'#78909c';
    return `<div class="rcard" style="animation-delay:${Math.min(i*30,300)}ms" onclick="openDetail(${r.id})">
      <span class="cat" style="background:${catColor}">${CE[r.categorie]||'🌿'} ${esc(r.categorie)}</span>
      <h3>🌿 ${esc(r.maladie)}</h3>
      <div class="meta">${esc(r.zone||'')} · ${esc(r.gravite||'')}</div>
      <p>${esc(r.complement)||''} ${r.recours ? '— '+esc(r.recours) : ''}</p>
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', ()=>{ activeCat=null; render(); });

function findRec(id){ return db.find(r=>r.id===id); }

function disclaimerHTML(){
  return `<div class="disclaimer">⚠️ <b>Ces informations sont fournies à titre éducatif et ne remplacent pas un avis médical.</b> Atlas Nature ne pose aucun diagnostic et ne prescrit aucun traitement. En cas de doute, de symptôme persistant ou de situation grave, consultez un professionnel de santé.</div>`;
}
function urgenceBannerHTML(r){
  if (!(r.gravite||'').includes('🔴')) return '';
  return `<div class="urgence-banner">
    <div class="titre">🚨 Ce symptôme peut nécessiter une consultation rapide</div>
    <div class="nums">Contactez votre médecin traitant, ou en urgence : <b>15</b> (SAMU) · <b>112</b> (numéro d'urgence européen)</div>
  </div>`;
}

function openDetail(id){
  const r = findRec(id);
  if (!r) return;
  const catColor = CC[r.categorie]||'#78909c';
  document.getElementById('ficheCat').innerHTML = `${CE[r.categorie]||'🌿'} ${esc(r.categorie)}`;

  if (r.infographie_url){
    const aFaire = (r.a_faire||'').split('|').map(s=>s.trim()).filter(Boolean);
    const aEviter = (r.a_eviter||'').split('|').map(s=>s.trim()).filter(Boolean);
    document.getElementById('ficheContent').innerHTML = `
      <div class="infograph-full" onclick="openImgViewer('${esc(r.infographie_url)}')"><img src="${esc(r.infographie_url)}" alt="Infographie ${esc(r.maladie)}"></div>
      <div class="fiche-body">
        <div class="fiche-head"><h1>🌿 ${esc(r.maladie)}</h1><div class="meta">${esc(r.zone||'')} · ${esc(r.gravite||'')}</div></div>
        ${urgenceBannerHTML(r)}
        <div class="grid-prem">
          ${r.historique ? `<div class="box full histo">📜 <b>D'où vient ce remède ?</b>${esc(r.historique)}</div>` : ''}
          <div class="box"><b>💊 Complément</b>${esc(r.complement)||'—'}</div>
          <div class="box"><b>⚗️ Posologie</b>${esc(r.recours)||'—'}</div>
          ${r.duree_cure ? `<div class="box"><b>⏱️ Durée de cure</b>${esc(r.duree_cure)}</div>` : ''}
          <div class="box"><b>📍 Où le trouver</b>${esc(r.ou)||'—'}</div>
          ${aFaire.length ? `<div class="box full"><b>✅ À faire</b><ul class="chk ok">${aFaire.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
          ${aEviter.length ? `<div class="box"><b>❌ À éviter</b><ul class="chk no">${aEviter.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
          ${r.associations ? `<div class="box"><b>🔄 Associations</b>${esc(r.associations)}</div>` : ''}
          ${r.preparation ? `<div class="box"><b>🍽️ Préparation</b>${esc(r.preparation)}</div>` : ''}
          <div class="box full alert"><b>⚠️ Contre-indication</b>${esc(r.contre)||'—'}</div>
          <div class="box full alert"><b>🚨 Quand consulter</b>${esc(r.drapeaux)||'—'}</div>
          ${r.reference ? `<div class="box full"><b>📦 Référence cabinet</b>${esc(r.reference)}</div>` : ''}
        </div>
        <div style="margin-top:6px"><button onclick="editRec(${r.id})" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px 18px;border-radius:20px;font-size:.85rem;cursor:pointer">✏️ Modifier</button></div>
        ${disclaimerHTML()}
      </div>`;
  } else {
    document.getElementById('ficheContent').innerHTML = `
      <div class="fiche-body" style="margin-top:20px">
        <div class="fiche-head"><h1>🌿 ${esc(r.maladie)}</h1><div class="meta">${esc(r.zone||'')} · ${esc(r.gravite||'')}</div></div>
        ${urgenceBannerHTML(r)}
        <div class="grid-prem">
          <div class="box full"><b>Symptômes</b>${esc(r.symptomes)||'—'}</div>
          <div class="box"><b>Complément</b>${esc(r.complement)||'—'}</div>
          <div class="box"><b>Où le trouver</b>${esc(r.ou)||'—'}</div>
          <div class="box"><b>Recours / posologie</b>${esc(r.recours)||'—'}</div>
          <div class="box full alert"><b>Contre-indication</b>${esc(r.contre)||'—'}</div>
          <div class="box full alert"><b>🚨 Drapeaux rouges</b>${esc(r.drapeaux)||'—'}</div>
          ${r.reference ? `<div class="box full"><b>Référence cabinet</b>${esc(r.reference)}</div>` : ''}
        </div>
        <div style="margin-top:6px"><button onclick="editRec(${r.id})" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px 18px;border-radius:20px;font-size:.85rem;cursor:pointer">✏️ Modifier</button></div>
        ${disclaimerHTML()}
      </div>`;
  }

  const page = document.getElementById('fichePage');
  page.scrollTop = 0;
  requestAnimationFrame(()=> page.classList.add('open'));
  history.pushState({fiche:id}, '', '#remede/' + encodeURIComponent(r.maladie));
}

function closeFiche(){
  document.getElementById('fichePage').classList.remove('open');
  if (location.hash.startsWith('#remede/')) history.pushState({}, '', location.pathname);
}
window.addEventListener('popstate', ()=>{
  if (!location.hash.startsWith('#remede/')) document.getElementById('fichePage').classList.remove('open');
});

loadDB();

// ---- Viewer plein écran de l'infographie (mobile) ----
function openImgViewer(url){
  document.getElementById('imgViewerImg').src = url;
  document.getElementById('imgViewer').classList.add('open');
  setTimeout(()=>{
    const v = document.getElementById('imgViewer');
    v.scrollLeft = (v.scrollWidth - v.clientWidth) / 2;
  }, 50);
}
function closeImgViewer(){
  document.getElementById('imgViewer').classList.remove('open');
}

// ---- Édition protégée par mot de passe ----
const ADMIN_PASSWORD = 'akashic2026'; // à changer par le mot de passe de ton choix
let unlocked = false;
let editingId = null;

function checkAccess(){
  if (unlocked) return true;
  const pwd = prompt('🔒 Mot de passe pour modifier la base :');
  if (pwd === ADMIN_PASSWORD){ unlocked = true; return true; }
  if (pwd !== null) showStatus('Mot de passe incorrect', true);
  return false;
}

function showStatus(msg, isError){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.style.background = isError ? '#d32f2f' : '#263238';
  el.style.opacity = 1;
  setTimeout(()=>{ el.style.opacity = 0; }, 2500);
}

function editRec(id){
  if (!checkAccess()) return;
  const r = findRec(id);
  if (!r) return;
  editingId = id;
  const form = document.getElementById('rform');
  ['categorie','maladie','symptomes','complement','recours','contre','drapeaux'].forEach(k=>{
    if (form[k]) form[k].value = r[k] || '';
  });
  document.getElementById('formModal').style.display = 'flex';
}

function closeForm(){
  document.getElementById('formModal').style.display = 'none';
}

async function saveForm(){
  const form = document.getElementById('rform');
  const payload = {};
  ['categorie','maladie','symptomes','complement','recours','contre','drapeaux'].forEach(k => payload[k] = form[k].value);

  const { error } = await sb.from('remedes').update(payload).eq('id', editingId);
  if (error){ showStatus('Erreur : ' + error.message, true); return; }
  showStatus('Remède mis à jour ✅');
  closeForm();
  await loadDB();
  render();
}

// ---- Dictée vocale ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

if (SpeechRecognition){
  document.getElementById('micBtn').style.display = 'inline-block';
  const recognition = new SpeechRecognition();
  recognition.lang = 'fr-FR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  window.startDictation = function(){
    const btn = document.getElementById('micBtn');
    btn.textContent = '🔴';
    recognition.start();
  };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById('searchInput').value = text;
    activeCat = null;
    render();
  };
  recognition.onend = () => { document.getElementById('micBtn').textContent = '🎤'; };
  recognition.onerror = () => { document.getElementById('micBtn').textContent = '🎤'; };
} else if (isIOS) {
  const iosHint = document.createElement('p');
  iosHint.textContent = '🎤 Astuce iPhone : touchez le micro du clavier pour dicter votre recherche';
  iosHint.style.cssText = 'opacity:.55;font-size:.75rem;text-align:center;margin-top:8px;text-shadow:0 1px 6px rgba(0,0,0,.7)';
  document.querySelector('.chips-wrap').after(iosHint);
}
</script>
</body>
</html>
